server.port=${PORT:8000}
# Single file DB (H2). Swap to Oracle/Postgres with one URL change, same SQL semantics.
# DB_PATH=/tmp/seats -> jdbc:h2:file:/tmp/seats
app.db-path=${DB_PATH:/tmp/seats}
spring.sql.init.mode=never
logging.pattern.console=%msg%n
# Free-tier burst tuning: bounded threads (each costs ~1MB stack), deep queues so
# buyers wait for a correct answer instead of being refused, generous timeouts.
server.tomcat.threads.max=75
server.tomcat.accept-count=1000
server.tomcat.max-connections=2000
server.tomcat.connection-timeout=120s
server.tomcat.keep-alive-timeout=60s
# Quiet Spring internals under burst; our own request logs stay on.
logging.level.root=WARN
logging.level.seats=INFO
